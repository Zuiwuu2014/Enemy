name: Build Desktop TV APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建桌面模式 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # libs/ 在上游是 git submodule（bv-libs，约 82 MB，含 libVLC / ffmpeg / av1 预编译产物）。
      # 源码以 zip 分发时没有 .git，submodule 拉不下来，这里直接 clone 覆盖到 libs/。
      # 如果你本地已经有完整 libs/，这一步会自动跳过。
      - name: 补齐 libs 子模块
        run: |
          set -e
          if [ ! -d libs/libVLC ]; then
            rm -rf libs
            git clone --depth 1 https://github.com/aaa1115910/bv-libs.git libs
          fi
          echo "libs 内容："
          ls -1 libs

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDefaultDebug --stacktrace --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bv-desktop-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 上传构建日志（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            buildSrc/build/**
          if-no-files-found: ignore
